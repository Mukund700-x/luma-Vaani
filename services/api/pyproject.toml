[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "luma-vaani-api"
version = "0.1.0"
description = "Luma Vaani Hospital AI Platform — FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.3",

    # Validation / Settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",

    # HTTP client
    "httpx>=0.27.0",

    # Redis / cache
    "redis>=5.1.0",

    # Timezone data (required for zoneinfo on systems without native tz db)
    "tzdata>=2024.1",

    # AI / LLM
    "google-generativeai>=0.8.0",   # Gemini 1.5 Flash / Pro
    "httpx>=0.27.0",                  # async HTTP for webhooks and channels

    # Notifications (Phase 6)
    "twilio>=9.0.0",                  # SMS + WhatsApp Business
    "aiosmtplib>=3.0.0",             # async SMTP email delivery
    "jinja2>=3.1.0",                  # notification template rendering

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=30.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
